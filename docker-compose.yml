version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: adsflow-postgres
    restart: always
    environment:
      POSTGRES_USER: adsflow_user
      POSTGRES_PASSWORD: adsflow_password
      POSTGRES_DB: adsflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adsflow_user -d adsflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsflow-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: super_secret_adsflow_key_12345
      DATABASE_URL: "postgresql://adsflow_user:adsflow_password@postgres:5432/adsflow_db?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adsflow-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: